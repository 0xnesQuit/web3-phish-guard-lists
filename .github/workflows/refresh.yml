name: Refresh lists

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the data files. Runs third-party code (npm dependencies, remote APIs) but never sees the signing key.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: DefiLlama protocols
        run: node scripts/build-brands.mjs
      - name: CoinMarketCap tokens
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          if [ -n "$CMC_API_KEY" ]; then node scripts/build-cmc-brands.mjs 5000 || echo "CMC run failed, keeping previous list"; else echo "CMC_API_KEY not set, skipping"; fi
      - name: OpenSea collections
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          if [ -n "$OPENSEA_API_KEY" ]; then node scripts/build-nft-brands.mjs 300 || echo "OpenSea run failed, keeping previous list"; else echo "OPENSEA_API_KEY not set, skipping"; fi
      - name: Community blocklist (approved user reports)
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -n "$API_BASE" ]; then
            curl -fsS "$API_BASE/v1/community.json" -o /tmp/community.json && node -e 'const j=require("/tmp/community.json"); if(!Array.isArray(j.domains)) process.exit(1); require("fs").writeFileSync("data/community-blocklist.json", JSON.stringify({updatedAt:j.updatedAt||0, domains:j.domains, auto:Array.isArray(j.auto)?j.auto:[]}))' || echo "community fetch failed, keeping previous"
          else echo "API_BASE var not set, skipping"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data
          path: data/
          retention-days: 1

  # Signs and publishes. A fresh checkout, no dependency install, no third-party code: only node:crypto and git.
  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: data
          path: data/
      - name: Manifest (signed)
        env:
          LISTS_SIGNING_KEY: ${{ secrets.LISTS_SIGNING_KEY }}
        run: node scripts/publish-lists.mjs data
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lists-bot"
          git config user.email "lists-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "lists: refresh $(date -u +%Y-%m-%d)" && git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; fi
